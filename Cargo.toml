[package]
name = "watt-did"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
bs58 = "0.5"
did-method-key = { version = "0.5", default-features = false }
did-web = "0.5"
ed25519-dalek = "2"
percent-encoding = "2.3"
pollster = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssi-dids-core = { version = "0.3", default-features = false }
thiserror = "2"
