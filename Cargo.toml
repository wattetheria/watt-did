[package]
name = "watt-did"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = "2"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
